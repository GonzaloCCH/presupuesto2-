<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Presupuesto 2</title>
<meta name="theme-color" content="#2457D6">
<meta name="apple-mobile-web-app-title" content="Presupuesto 2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#EEF2F7;--card:#FFFFFF;--ink:#14202E;--mut:#5C6B7D;--line:#D9E1EA;--acc:#2457D6;--accbg:#DCE6FA;--ok:#15803D;--rd:#DC2626;--or:#EA580C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1420;--card:#152031;--ink:#E7EEF7;--mut:#8EA0B5;--line:#263649;--acc:#7FA6FF;--accbg:#1C2E52;--ok:#4ADE80;--rd:#F87171;--or:#FB923C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1420;--card:#152031;--ink:#E7EEF7;--mut:#8EA0B5;--line:#263649;--acc:#7FA6FF;--accbg:#1C2E52;--ok:#4ADE80;--rd:#F87171;--or:#FB923C;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
header#top button{flex:1;min-width:0;background:none;color:var(--mut);border-radius:0;padding:8px 0 6px;font-size:10px;line-height:1.1;font-weight:600}

header#top button.on{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}
h2{font-size:15px;margin:0 0 10px;font-weight:600;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sub{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>input,.row>select{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--card);font-weight:600}
button.ghost{background:transparent;color:var(--mut);padding:6px 8px;font-size:14px;white-space:nowrap}
button.alt{background:var(--accbg);color:var(--acc)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;padding:6px 0}
.hr{display:flex;align-items:center;gap:6px}
.tgb{font-size:13px;font-weight:600;color:var(--acc);background:var(--accbg);padding:5px 10px;border-radius:20px;white-space:nowrap}
.pn{opacity:.4;font-size:16px;padding:2px 4px}.pn.on{opacity:1}
.tag{font-size:13px;color:var(--mut)}
.lb{font-size:12px;color:var(--mut);display:block;margin:6px 0 2px}
.item{padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ok{color:var(--ok)}.rd{color:var(--rd)}.or{color:var(--or)}.mu{color:var(--mut)}
.amt{font-weight:700;white-space:nowrap}
.bar{height:6px;border-radius:4px;background:var(--accbg);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.empty{color:var(--mut);text-align:center;padding:12px 0}
.ef{display:grid;gap:4px;margin-top:8px;padding:10px;background:var(--bg);border-radius:10px}
.ef label{font-size:12px;color:var(--mut)}
.ef input,.ef select{background:var(--card)}
.num{text-align:right;max-width:130px}
textarea{font:13px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;height:84px;margin-bottom:8px}
#act{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#act button{flex:1;max-width:270px;padding:13px 8px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none}
#sheet.on{display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:30}
#toast.on{opacity:1}
.ic{width:34px;height:34px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .15s}
header#top button.on .ic{transform:translateY(-1px) scale(1.07)}
.st-emoji .ic{font-size:23px}
.st-esfera .ic{border-radius:50%;background:radial-gradient(circle at 32% 24%,var(--c1),var(--c) 58%,var(--c2));box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 -3px 5px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.55)}
.st-relieve .ic{border-radius:10px;background:linear-gradient(145deg,var(--c1),var(--c) 55%,var(--c2));box-shadow:0 4px 0 var(--c2),0 6px 8px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.6);margin-bottom:8px}
.st-cristal .ic{border-radius:12px;background:linear-gradient(160deg,rgba(255,255,255,.6),var(--c) 45%,var(--c2));border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8)}
.st-plano .ic{border-radius:10px;background:var(--c)}
.stp{background:var(--bg);color:var(--ink);padding:8px 2px;font-size:11px;border:2px solid transparent;border-radius:12px}
.stp.on{border-color:var(--acc)}
.stp .ic{margin-bottom:4px}
.cp{display:block;text-align:center;font-size:11px;color:var(--mut)}
.cp input{height:36px;padding:2px;margin-bottom:2px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.chk input{width:auto}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<div id="act"><button onclick="openSh('p')">＋ Presupuesto</button><button class="alt" onclick="openSh('s')">＋ Salida</button></div>
<div id="sheet" onclick="if(event.target===this)closeSh()"></div>
<div id="toast" role="status"></div>
<script>
var KEY="presupuesto-b1";
function id(){return Math.random().toString(36).slice(2,9)}
var S=null;
try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):null}catch(e){}
if(!S)S={cfg:{cats:[],tipos:[],cuentas:[],ubic:[],gastos:[]},ing:{},plan:[],sal:[],acum:[],deudas:[],pagos:[],pl:[],ps:{F:0,V:0}};
mig();

var _n=new Date();
var V={tab:"ini",mes:_n.getFullYear()+"-"+("0"+(_n.getMonth()+1)).slice(-2),q:_n.getDate()<=15?1:2,o:{gp:true,sl:true},ed:"",met:"",sheet:"",all:false};
var MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return Number(n||0).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fd(s){return s?s.split("-").reverse().join("/"):""}
function R(n){return Math.round(n*100)/100}
function key(){return V.mes+"-"+V.q}
function nom(k){var a=k.split("-");return MES[+a[1]-1]+" "+a[0]+" · "+(a[2]==1?"1ª":"2ª")+" quincena"}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function sum(a){return a.reduce(function(t,x){return t+Number(x.m||0)},0)}
function by(l,i){return l.filter(function(x){return x.id===i})[0]}
function nmx(l,i){var x=by(l,i);return x?esc(x.n):"—"}
function op(l,s,b){return (b?'<option value="">'+b+'</option>':'')+l.map(function(x){return '<option value="'+x.id+'"'+(x.id===s?' selected':'')+'>'+esc(x.n)+'</option>'}).join("")}
function val(i){var e=document.getElementById(i);return e?e.value.trim():""}
function clr(l){l.forEach(function(i){var e=document.getElementById(i);if(e)e.value=""})}
function msg(t){var e=document.getElementById("toast");e.textContent=t;e.className="on";clearTimeout(msg.t);msg.t=setTimeout(function(){e.className=""},2800)}
function tg(k){V.o[k]=!V.o[k];draw()}
function pin(k){S.pin[k]=!S.pin[k];if(!S.pin[k])V.o[k]=true;save();draw()}
function isO(k){return !!(V.o[k]||S.pin[k])}
function ted(k){V.ed=V.ed===k?"":k;draw()}
function go(t){V.tab=t;draw();window.scrollTo(0,0)}
function openSh(t){V.sheet=t;draw()}
function closeSh(){V.sheet="";draw()}
function lst(L){return L.indexOf("cfg.")===0?S.cfg[L.slice(4)]:S[L]}
/* cálculos */
function P(g,k){return sum(S.plan.filter(function(x){return x.g===g&&x.k===k}))+sum(S.sob.filter(function(x){return x.g===g&&x.k===k}))}
function U(g,k){return sum(S.sal.filter(function(x){return x.g===g&&x.k===k}))}
function stt(p,u){var so=R(p-u);return !p?{t:u?"sin presupuesto":"sin movimiento",c:"mu",so:so}:so<0?{t:"excedido",c:"or",so:so}:so===0?{t:"agotado",c:"rd",so:so}:{t:"disponible",c:"ok",so:so}}
function bal(c){var a=sum(S.plan.filter(function(x){return x.p===c})),s=sum(S.sob.filter(function(x){return x.p===c})),b=sum(S.acum.filter(function(x){return x.p===c})),g=sum(S.sal.filter(function(x){return x.p===c}));return {a:R(a+s),b:b,g:g,d:R(a+s+b-g)}}
function tcs(){var rc=S.cfg.cuentas.filter(function(c){return c.r});if(!rc.length)return null;var s=0,rt=0;rc.forEach(function(c){var a=ac(c);s+=a.cons;rt+=a.ret});return {rc:rc,cons:R(s-sum(S.tcp)),ret:R(rt)}}
function vcs(){var r=0,m=0;S.vc.forEach(function(x){var q=x.c>0?x.m/x.c:0;if(x.pg<x.c){r+=(x.c-x.pg)*q;m+=q}});return {r:R(r),m:R(m)}}
function inUse(k,i){var c=S.cfg;
  if(k==="cats")return c.gastos.some(function(x){return x.c===i});
  if(k==="tipos")return c.gastos.some(function(x){return x.t===i});
  if(k==="ubic")return S.deudas.some(function(x){return x.u===i});
  if(k==="cuentas")return S.tcp.some(function(x){return x.c===i})||[S.plan,S.sal,S.acum,S.pl,S.sob].some(function(l){return l.some(function(x){return x.p===i})});
  if(k==="gastos")return [S.plan,S.sal,S.pl,S.sob].some(function(l){return l.some(function(x){return x.g===i})});
  return false}
function mig(){
  if(!S.cfg)S.cfg={cats:[],tipos:[],cuentas:[],ubic:[],gastos:[]};
  ["plan","sal","acum","deudas","pagos","pl","tcp","vc","sob","grupos"].forEach(function(k){S[k]=S[k]||[]});
  S.ing=S.ing||{};S.ps=S.ps||{F:0,V:0};S.pin=S.pin||{};S.tc=S.tc||{lim:0};S.ui=S.ui||{st:"esfera",c:{}};S.ui.c=S.ui.c||{};
  if(S.tc.cta){var c=by(S.cfg.cuentas,S.tc.cta);if(c)c.r=true;delete S.tc.cta}}
function ac(c){var b=bal(c.id);if(!c.r)return {d:b.d,ret:0,cons:0,lib:0,b:b};var lib=sum(S.tcp.filter(function(x){return x.c===c.id})),cons=R(sum(S.sal.filter(function(x){return x.p===c.id})));return {d:0,ret:R(b.a+b.b-lib),cons:cons,lib:lib,b:b}}
function sobr(k){return R((S.ing[k]||0)-sum(S.plan.filter(function(x){return x.k===k}))-sum(S.sob.filter(function(x){return x.k===k})))}
function mix(a,b,t){var x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16),r=function(s){return Math.round(((x>>s)&255)*(1-t)+((y>>s)&255)*t)};return "#"+[16,8,0].map(function(s){return ("0"+r(s).toString(16)).slice(-2)}).join("")}
function cv(c){return "--c:"+c+";--c1:"+mix(c,"#ffffff",0.5)+";--c2:"+mix(c,"#000000",0.35)}
var IC=[["ini","🏠","Inicio"],["res","📊","Resumen"],["pre","📋","Presup."],["sal","💸","Salidas"],["cue","🏦","Cuentas"],["deu","🧾","Deudas"],["fij","📌","Fijos"],["aju","⚙️","Ajustes"]];
var DEFC={ini:"#3B82F6",res:"#8B5CF6",pre:"#10B981",sal:"#F59E0B",cue:"#06B6D4",deu:"#EF4444",fij:"#EC4899",aju:"#64748B"};
function ucol(k){return S.ui.c[k]||DEFC[k]}
/* edición genérica */
function ch(L,i,p,n){return ' onchange="up(\''+L+'\',\''+i+'\',\''+p+'\',this.value'+(n?',1':'')+')"'}
function up(L,i,p,v,n){var x=by(lst(L),i);if(!x)return;if(p==="n"&&!v.trim())return;x[p]=n?(+v||0):v;save();draw()}
function rm(L,i){var c=L.indexOf("cfg.")===0;if(c&&inUse(L.slice(4),i)){msg("No se puede eliminar: está en uso.");return}
  if(L==="sal"){var x0=by(S.sal,i);if(x0&&x0.sb)S.sob=S.sob.filter(function(y){return y.id!==x0.sb})}
  var nl=lst(L).filter(function(x){return x.id!==i});if(c)S.cfg[L.slice(4)]=nl;else S[L]=nl;
  if(L==="deudas")S.pagos=S.pagos.filter(function(x){return x.d!==i});V.ed="";save();draw()}
function form(L,x,fl){return '<div class="ef">'+fl.map(function(c){var h='<label>'+c[1]+'</label>';
  h+=c[2]==="s"?'<select'+ch(L,x.id,c[0])+'>'+op(c[3],x[c[0]],"—")+'</select>':'<input type="'+(c[2]==="n"?'number" inputmode="decimal" step="0.01':c[2]==="d"?'date':'text')+'" value="'+esc(x[c[0]])+'"'+ch(L,x.id,c[0],c[2]==="n")+'>';return h}).join("")+'<button class="ghost" onclick="rm(\''+L+'\',\''+x.id+'\')">Eliminar</button></div>'}
function FP(){return [["g","Gasto","s",S.cfg.gastos],["m","Monto","n"],["p","Cuenta","s",S.cfg.cuentas],["f","Fecha","d"],["nt","Notas","t"]]}
function hd(k,t,s,np){
  var p=S.pin[k],r='';
  if(p)r='<span class="tgb" onclick="event.stopPropagation();pin(\''+k+'\')">📌 Fija</span>';
  else r=(np?'':'<span class="pn" onclick="event.stopPropagation();pin(\''+k+'\')" title="Mantener abierta">📌</span>')+'<span class="tgb">'+(V.o[k]?"Ocultar ▾":"Ver ▸")+'</span>';
  return '<div class="hd" onclick="'+(p?'':'tg(\''+k+'\')')+'"><div><b>'+t+'</b><div class="tag">'+s+'</div></div><span class="hr">'+r+'</span></div>'}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'}
function head(){return '<div class="grid"><input type="month" value="'+V.mes+'" onchange="V.mes=this.value||V.mes;draw()"><select onchange="V.q=+this.value;draw()"><option value="1"'+(V.q==1?" selected":"")+'>1ª quincena</option><option value="2"'+(V.q==2?" selected":"")+'>2ª quincena</option></select></div>'}
/* líneas */
function lineP(x){
  var g=by(S.cfg.gastos,x.g)||{n:"(eliminado)"},p=P(x.g,x.k),u=U(x.g,x.k),s=stt(p,u),low=s.so>0&&s.so<=p*0.2;
  return '<div class="item"><div class="row" onclick="ted(\'plan:'+x.id+'\')" style="cursor:pointer"><b class="'+s.c+'">'+esc(g.n)+'</b><span class="amt">'+f(x.m)+'</span></div><div class="tag">'+s.t+(low?' · por agotarse':'')+' · Salida '+f(u)+' · Sobra '+f(s.so)+'</div>'+(V.ed==="plan:"+x.id?form("plan",x,FP()):'')+'</div>'}
function salRows(all){var ac={};return S.sal.filter(function(x){return all||x.k===key()}).map(function(x){var kk=x.g+"|"+x.k;ac[kk]=(ac[kk]||0)+x.m;var p=P(x.g,x.k);return {x:x,p:p,a:ac[kk],s:stt(p,ac[kk])}})}
function lineS(r){
  var x=r.x,g=by(S.cfg.gastos,x.g)||{n:"(eliminado)"};
  return '<div class="item"><div class="row" onclick="ted(\'sal:'+x.id+'\')" style="cursor:pointer"><b class="'+r.s.c+'">'+esc(g.n)+'</b><span class="amt">'+f(x.m)+'</span></div>'
   +'<div class="tag">'+r.s.t+' · '+fd(x.f)+' · '+nmx(S.cfg.cuentas,x.p)+(x.sb?' · del sobrante':'')+(x.nt?' · '+esc(x.nt):'')+(V.all?' · '+nom(x.k):'')+'</div>'
   +'<div class="tag">Presupuesto '+f(r.p)+' · acumulado '+f(r.a)+' · sobrante '+f(r.s.so)+'</div>'+(V.ed==="sal:"+x.id?form("sal",x,FP()):'')+'</div>'}
/* inicio */
function rowC(c){
  var a=ac(c),t=c.r;
  return '<div class="item"><div class="row"><b>'+(t?"🔒 ":"")+esc(c.n)+'</b><span class="amt '+(t?"":a.d<0?"or":"ok")+'">'+f(t?a.ret:a.d)+'</span></div><div class="tag">'+(t?'Retenido (no se toca) · consumo en tarjeta '+f(a.cons):'Ingresos '+f(a.b.a+a.b.b)+' · gastados '+f(a.b.g))+'</div><div class="row" style="justify-content:flex-end">'+(t?'<button class="ghost" onclick="liberar(\''+c.id+'\')">Liberar y pagar tarjeta</button>':'')+'<button class="ghost" onclick="tgR(\''+c.id+'\')">'+(t?'Quitar retención':'Retener')+'</button></div></div>'}
function grpRow(g){
  var m=g.ids.map(function(i){return by(S.cfg.cuentas,i)}).filter(Boolean),d=R(m.reduce(function(t,c){return t+ac(c).d},0)),rt=R(m.reduce(function(t,c){return t+ac(c).ret},0)),k="sg"+g.id;
  return '<div class="item">'+hd(k,"👥 "+esc(g.n),'Disponible <b class="'+(d<0?"or":"ok")+'">'+f(d)+'</b>'+(rt?' · retenido '+f(rt):'')+' · '+m.length+' cuentas',true)+(V.o[k]?m.map(rowC).join(""):'')+'</div>'}
function saldoCard(){
  var L=S.cfg.cuentas,tot=R(L.reduce(function(t,c){return t+ac(c).d},0)),st=tcs(),h='<div class="card">'+hd("sd","Saldo por cuenta",'Disponible <b class="'+(tot<0?"or":"ok")+'">'+f(tot)+'</b>'+(st?' · retenido '+f(st.ret):''));
  if(isO("sd")){
    if(!L.length)h+='<div class="empty">Agrega tus cuentas en Ajustes.</div>';
    var gi={};S.grupos.forEach(function(g){g.ids.forEach(function(i){gi[i]=1});h+=grpRow(g)});
    L.forEach(function(c){if(!gi[c.id])h+=rowC(c)});
    h+=kv("Disponible total",f(tot))+(st?kv("Retenido para la tarjeta",f(st.ret))+kv("Consumo en tarjeta",f(st.cons)):'')}
  return h+'</div>'}
function ini(){
  var c=S.cfg,h=saldoCard()+head();
  if(!c.gastos.length||!c.cuentas.length)h+='<div class="card"><b>Empieza aquí</b><div class="tag" style="margin:6px 0 10px">Crea primero tus categorías, tipos de gasto, cuentas y gastos en Ajustes. Después solo los eliges al registrar.</div><button style="width:100%" onclick="go(\'aju\')">Ir a Ajustes</button></div>';
  else h+='<div class="tag" style="text-align:center;padding:8px">Usa ＋ Presupuesto y ＋ Salida, abajo, para registrar.</div>';
  return h}
/* formularios (hoja inferior) */
function sheet(){
  if(!V.sheet)return"";

  var h='<div class="sh"><div class="row"><b>'+(V.sheet==="p"?"Nuevo gasto del presupuesto":sb?"Salida del sobrante":"Nueva salida")+'</b><button class="ghost" onclick="closeSh()">✕ Cerrar</button></div><div class="tag" style="margin:2px 0 10px">'+nom(key())+'</div>';
  if(V.sheet==="s")h+='<div class="grid"><button class="'+(V.sob?"alt":"")+'" onclick="V.sob=false;draw()">Gasto normal</button><button class="'+(V.sob?"":"alt")+'" onclick="V.sob=true;draw()">Del sobrante</button></div>';
  if(!ok)return h+'<div class="empty">Primero crea '+(sb?'tus cuentas':'tus gastos y cuentas')+' en Ajustes.</div><button style="width:100%" onclick="closeSh();go(\'aju\')">Ir a Ajustes</button></div>';
  if(V.sheet==="p")return h+'<div class="grid"><select id="pg">'+op(c.gastos,"","Gasto…")+'</select><input id="pm" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><div class="grid"><select id="pp">'+op(c.cuentas,"","Cuenta…")+'</select><input id="pf" type="date" value="'+today()+'"></div><input id="pn" placeholder="Notas (opcional)" style="margin-bottom:8px"><button style="width:100%" onclick="addP()">Guardar gasto</button></div>';
  if(sb)return h+'<input id="sbn" list="gl" placeholder="Nombre del gasto" style="margin-bottom:8px"><datalist id="gl">'+c.gastos.map(function(x){return '<option value="'+esc(x.n)+'">'}).join("")+'</datalist><div class="grid"><select id="sbc">'+op(c.cats,"","Categoría…")+'</select><select id="sbt">'+op(c.tipos,"","Tipo…")+'</select></div><div class="grid"><input id="sbm" type="number" inputmode="decimal" step="0.01" placeholder="Monto"><select id="sbp">'+op(c.cuentas,"","Cuenta…")+'</select></div><div class="grid"><input id="sbf" type="date" value="'+today()+'"><input id="sbo" placeholder="Notas (opcional)"></div><div id="sbi" class="tag" style="margin-bottom:8px"></div><button style="width:100%" onclick="addSb()">Guardar salida del sobrante</button></div>';
  return h+'<div class="grid"><select id="sg" onchange="sinfo()">'+op(c.gastos,"","Gasto…")+'</select><input id="sm" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><div class="grid"><select id="sp" onchange="sinfo()">'+op(c.cuentas,"","Cuenta…")+'</select><input id="sf" type="date" value="'+today()+'"></div><input id="sn" placeholder="Notas (opcional)" style="margin-bottom:8px"><div id="si" class="tag" style="margin-bottom:8px"></div><button style="width:100%" onclick="addS()">Guardar salida</button></div>'}
function addSb(){
  var n=val("sbn"),m=parseFloat(val("sbm")),p=val("sbp");
  if(!n||!p||!(m>0)){msg("Escribe nombre, monto y cuenta.");return}
  var g=S.cfg.gastos.filter(function(x){return x.n.toLowerCase()===n.toLowerCase()})[0];
  if(!g){g={id:id(),n:n,c:val("sbc"),t:val("sbt")};S.cfg.gastos.push(g)}
  var so=sobr(key()),sid=id(),fe=val("sbf")||today(),nt=val("sbo");
  S.sob.push({id:sid,k:key(),g:g.id,m:m,p:p,f:fe,nt:nt});
  S.sal.push({id:id(),g:g.id,m:m,p:p,f:fe,nt:nt,k:key(),sb:sid});
  save();clr(["sbn","sbc","sbt","sbm","sbp","sbo"]);draw();msg(m>so?"Guardada. Era mayor que el sobrante disponible.":"Salida del sobrante guardada")}
function sbinfo(){var e=document.getElementById("sbi");if(!e)return;var so=sobr(key());e.innerHTML='Sobrante disponible: <b class="'+(so<0?"or":"ok")+'">'+f(so)+'</b> · el monto entra a la cuenta y sale como gasto'}
function addP(){
  var g=val("pg"),m=parseFloat(val("pm")),p=val("pp");
  if(!g||!p||!(m>0)){msg("Elige gasto y cuenta, y escribe un monto mayor que 0.");return}
  S.plan.push({id:id(),g:g,m:m,p:p,f:val("pf")||today(),nt:val("pn"),k:key()});save();clr(["pg","pm","pp","pn"]);draw();msg("Gasto guardado")}
function sinfo(){
  var g=val("sg"),p=val("sp"),e=document.getElementById("si");if(!e)return;var h="";
  if(g){var pr=P(g,key()),u=U(g,key()),s=stt(pr,u);h+='<span class="'+s.c+'"><b>'+s.t+'</b></span> · presupuesto '+f(pr)+' · usado '+f(u)+' · sobra '+f(s.so)+'<br>'}
  if(p){var c=by(S.cfg.cuentas,p),a=c?ac(c):null;if(a)h+=c.r?'Cuenta retenida · retenido '+f(a.ret)+' · consumo '+f(a.cons):'Disponible en la cuenta: <b class="'+(a.d<0?"or":"ok")+'">'+f(a.d)+'</b>'}
  e.innerHTML=h}
function addS(){
  var g=val("sg"),m=parseFloat(val("sm")),p=val("sp");
  if(!g||!p||!(m>0)){msg("Elige gasto y cuenta, y escribe un monto mayor que 0.");return}
  var c=by(S.cfg.cuentas,p),a=ac(c),corto=c.r?(a.cons+m>a.ret):(m>a.d);
  S.sal.push({id:id(),g:g,m:m,p:p,f:val("sf")||today(),nt:val("sn"),k:key()});save();clr(["sg","sm","sp","sn"]);draw();
  msg(corto?(c.r?"Guardada. El consumo supera lo retenido.":"Guardada. La cuenta no tenía saldo suficiente."):"Salida guardada")}
/* resumen */
function res(){
  var k=key(),a=S.plan.filter(function(x){return x.k===k}),sl=S.sal.filter(function(x){return x.k===k}),ing=S.ing[k]||0,g=sum(a),so=sobr(k),asg=sum(S.sob.filter(function(x){return x.k===k})),h=head()+'<div class="card"><h2>Resumen de la quincena</h2>'
   +kv("Monto estipulado",f(ing))+kv("Presupuestado",f(g))+kv("Asignado del sobrante",f(asg))+kv("Queda por asignar",'<span class="'+(so<0?"or":"ok")+'">'+f(so)+'</span>')+kv("Salidas",f(sum(sl)))+'</div>';
  function gg(y){return by(S.cfg.gastos,y.g)||{}}
  h+='<div class="card"><h2>Por categoría · toca una para ver sus gastos</h2>';
  var any=0;S.cfg.cats.concat([{id:"",n:"Sin categoría"}]).forEach(function(c){
    var l=a.filter(function(y){return (gg(y).c||"")===c.id}),s=sum(l);if(!l.length)return;any=1;
    h+='<div class="sub">'+hd("rc"+c.id,esc(c.n),f(s)+' · '+(g?(s/g*100).toFixed(0):0)+'% · '+l.length+' gastos',true)+(V.o["rc"+c.id]?l.map(lineP).join(""):'')+'</div>'});
  if(!any)h+='<div class="empty">Sin gastos en esta quincena.</div>';
  h+='</div>';
  function grupo(t,L,fn){var x='',n=0;L.forEach(function(e){var s=sum(a.filter(function(y){return fn(y,e)}));if(!s)return;n=1;x+='<div style="margin-bottom:8px"><div class="row"><span>'+esc(e.n)+'</span><b>'+f(s)+' <span class="tag">'+(g?(s/g*100).toFixed(0):0)+'%</span></b></div><div class="bar"><i style="width:'+(g?s/g*100:0)+'%"></i></div></div>'});
    return n?'<div class="card"><h2>'+t+'</h2>'+x+'</div>':''}
  return h+grupo("Por tipo de gasto",S.cfg.tipos,function(y,t){return gg(y).t===t.id})+grupo("Por cuenta",S.cfg.cuentas,function(y,c){return y.p===c.id})}
/* presupuesto */
function pmet(k){
  var a=S.plan.filter(function(x){return x.k===k}),h='';
  if(!S.cfg.cuentas.length)return '<div class="empty">Agrega tus cuentas en Ajustes.</div>';
  S.cfg.cuentas.forEach(function(c){var l=a.filter(function(x){return x.p===c.id}),o=V.met===c.id;
    h+='<div class="item"><div class="row" onclick="V.met=V.met===\''+c.id+'\'?\'\':\''+c.id+'\';draw()" style="cursor:pointer"><b>'+esc(c.n)+'</b><span class="amt">'+f(sum(l))+'</span></div><div class="tag">'+l.length+' movimientos · total '+f(sum(l))+' '+(o?'▾':'▸')+'</div>'+(o?(l.length?l.map(lineP).join(""):'<div class="empty">Sin gastos con esta cuenta.</div>'):'')+'</div>'});
  return h}
function copiarQ(){
  var k=key(),a=S.plan.filter(function(x){return x.k===k});if(!a.length){msg("No hay gastos que copiar.");return}
  var m=V.mes,q=2;if(V.q==2){var b=m.split("-"),y=+b[0],n=+b[1]+1;if(n>12){n=1;y++}m=y+"-"+("0"+n).slice(-2);q=1}
  var d=m+(q==1?"-01":"-16"),nk=m+"-"+q;
  a.forEach(function(x){S.plan.push({id:id(),g:x.g,m:x.m,p:x.p,f:d,nt:x.nt,k:nk})});
  if(!S.ing[nk])S.ing[nk]=S.ing[k]||0;save();V.mes=m;V.q=q;draw();msg("Copiados "+a.length+" gastos a la siguiente quincena")}

  msg(m>so?"Asignado. Era mayor que el sobrante.":R(so-m)===0?"Sobrante asignado por completo":"Asignado a la cuenta")}

/* tarjeta de crédito */
function tarjeta(){
  var t=S.tc,st=tcs(),vc=vcs(),h='<div class="card">'+hd("tj","💳 Tarjeta de crédito",st?'Consumo <b>'+f(st.cons)+'</b> · retenido '+f(st.ret):"Marca una cuenta como retenida en Saldo por cuenta o en Ajustes");
  if(!isO("tj"))return h+'</div>';
  h+='<div class="kv"><span>Límite de la tarjeta</span><input class="num" type="number" inputmode="decimal" step="0.01" value="'+t.lim+'" onchange="S.tc.lim=+this.value||0;save();draw()"></div>';
  if(st){h+=kv("Retenido en cuentas",f(st.ret))+kv("Consumo con tarjeta (por pagar)",f(st.cons));
    st.rc.forEach(function(c){var a=ac(c);h+='<div class="row" style="padding:4px 0"><span class="tag">🔒 '+esc(c.n)+' · retenido '+f(a.ret)+'</span><button class="alt" style="padding:6px 10px;font-size:14px;flex:0 0 auto" onclick="liberar(\''+c.id+'\')">Liberar y pagar</button></div>'})}
  if(vc.r)h+=kv("Visacuotas restantes",f(vc.r))+kv("Cuotas del mes",f(vc.m));
  if(t.lim)h+=kv("Disponible en la tarjeta",f(R(t.lim-(st?st.cons:0)-vc.r)));
  h+='<div class="sub">'+hd("tp","Cortes y pagos",S.tcp.length+" · "+f(sum(S.tcp)),true);
  if(V.o.tp){h+='<div class="grid"><input id="tpm" type="number" inputmode="decimal" step="0.01" placeholder="Monto pagado"><input id="tpf" type="date" value="'+today()+'"></div><input id="tpn" placeholder="Notas (opcional)" style="margin-bottom:8px"><div class="grid"><button class="alt" onclick="fillPay()">Usar todo el consumo</button><button onclick="addTp()">Registrar pago</button></div>'
    +S.tcp.slice().reverse().map(function(x){return '<div class="item"><div class="row" onclick="ted(\'tp:'+x.id+'\')" style="cursor:pointer"><span>'+fd(x.f)+(x.nt?' · '+esc(x.nt):'')+'</span><b class="amt">'+f(x.m)+'</b></div>'+(V.ed==="tp:"+x.id?form("tcp",x,[["m","Monto","n"],["f","Fecha","d"],["nt","Notas","t"]]):'')+'</div>'}).join("")}
  h+='</div><div class="sub">'+hd("vcs","Visacuotas",S.vc.length+" · restan "+f(vc.r),true);
  if(V.o.vcs){h+='<div class="grid"><input id="vn" placeholder="Compra"><input id="vm" type="number" inputmode="decimal" step="0.01" placeholder="Monto total"></div><div class="grid"><input id="vq" type="number" inputmode="numeric" placeholder="N.º de cuotas"><input id="vf" type="date" value="'+today()+'"></div><button style="width:100%;margin-bottom:6px" onclick="addVc()">Agregar visacuota</button>'
    +(S.vc.length?S.vc.map(function(x){var q=x.c>0?x.m/x.c:0;return '<div class="item"><div class="row" onclick="ted(\'vc:'+x.id+'\')" style="cursor:pointer"><b>'+esc(x.n)+(x.pg>=x.c?' ✓':'')+'</b><span class="amt">'+f(q)+' /mes</span></div><div class="tag">'+x.pg+' de '+x.c+' cuotas pagadas · restan '+f(R((x.c-x.pg)*q))+'</div>'+(x.pg<x.c?'<button class="ghost" onclick="vcPay(\''+x.id+'\')">Pagar una cuota</button>':'')+(V.ed==="vc:"+x.id?form("vc",x,[["n","Compra","t"],["m","Monto total","n"],["c","N.º de cuotas","n"],["pg","Cuotas pagadas","n"],["f","Fecha","d"]]):'')+'</div>'}).join(""):'<div class="empty">Sin visacuotas.</div>')}
  return h+'</div></div>'}
function liberar(i){
  var c=by(S.cfg.cuentas,i);if(!c)return;var a=ac(c);
  if(!(a.ret>0)){msg("No hay dinero retenido para liberar.");return}
  S.tcp.push({id:id(),f:today(),m:a.ret,nt:"Liberado de "+c.n,c:i});save();draw();
  msg("Liberados "+f(a.ret)+" y pagados a la tarjeta. Puedes deshacerlo en Cortes y pagos.")}
function tgR(i){var c=by(S.cfg.cuentas,i);if(c){c.r=!c.r;save();draw()}}
function tgm(gid,cid){
  var g=by(S.grupos,gid);if(!g)return;
  if(g.ids.indexOf(cid)>=0)g.ids=g.ids.filter(function(x){return x!==cid});
  else{S.grupos.forEach(function(o){o.ids=o.ids.filter(function(x){return x!==cid})});g.ids.push(cid)}
  save();draw()}

  if(S.grupos.length){h+='<h2>Mis grupos</h2>';S.grupos.forEach(function(g){h+='<div class="item"><div class="row"><input value="'+esc(g.n)+'"'+ch("grupos",g.id,"n")+'><button class="ghost" onclick="rm(\'grupos\',\''+g.id+'\')">Eliminar</button></div>'+L.map(function(c){return '<label class="chk"><input type="checkbox"'+(g.ids.indexOf(c.id)>=0?' checked':'')+' onchange="tgm(\''+g.id+'\',\''+c.id+'\')"> '+esc(c.n)+'</label>'}).join("")+'</div>'})}
  return h+'<div class="tag" style="margin-top:6px">En Saldo por cuenta, cada grupo aparece con su nombre y la suma. Al tocarlo se ven las cuentas que lo forman.</div></div>'}
function gnTg(i){V.gn=V.gn||[];var k=V.gn.indexOf(i);if(k>=0)V.gn.splice(k,1);else V.gn.push(i)}
function addGr(){
  var n=val("cakgr");V.gn=V.gn||[];
  if(!n){msg("Escribe un nombre para el grupo.");return}
  if(V.gn.length<2){msg("Marca al menos dos cuentas.");return}
  S.grupos.forEach(function(o){o.ids=o.ids.filter(function(x){return V.gn.indexOf(x)<0})});
  S.grupos.push({id:id(),n:n,ids:V.gn.slice()});V.gn=[];save();clr(["cakgr"]);draw();msg("Grupo creado. Míralo en Saldo por cuenta.")}
function icCard(){
  var ST=[["emoji","Emoji"],["esfera","Esfera 3D"],["relieve","Relieve 3D"],["cristal","Cristal"],["plano","Plano"]],h='<div class="card">'+hd("cfic","Iconos de navegación","Diseño y colores");
  if(!isO("cfic"))return h+'</div>';
  h+='<h2>Diseño</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px">'+ST.map(function(s){return '<button class="stp'+(S.ui.st===s[0]?' on':'')+'" onclick="S.ui.st=\''+s[0]+'\';save();draw()"><div class="st-'+s[0]+'"><span class="ic" style="'+cv(ucol("pre"))+'">📋</span></div>'+s[1]+'</button>'}).join("")+'</div>'
   +'<h2>Color de cada icono</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">'+IC.map(function(t){return '<label class="cp"><input type="color" value="'+ucol(t[0])+'" onchange="setCol(\''+t[0]+'\',this.value)">'+t[2]+'</label>'}).join("")+'</div>'
   +'<label class="cp" style="margin-bottom:8px">Un mismo color para todos<input type="color" value="#2457D6" onchange="allCol(this.value)"></label><button class="ghost" style="width:100%;border:1px solid var(--line)" onclick="resetCol()">Restablecer colores</button>';
  return h+'</div>'}
function fillPay(){var e=document.getElementById("tpm"),s=tcs();if(e&&s)e.value=Math.max(0,s.cons)}
function addTp(){var m=parseFloat(val("tpm")),s=tcs();if(!(m>0)){msg("Escribe un monto mayor que 0.");return}S.tcp.push({id:id(),f:val("tpf")||today(),m:m,nt:val("tpn")});save();clr(["tpm","tpn"]);draw();msg(s&&m>s.cons?"Pago registrado, mayor que el consumo.":"Pago registrado")}
function addVc(){var m=parseFloat(val("vm")),c=parseInt(val("vq"));if(!val("vn")||!(m>0)||!(c>0)){msg("Escribe compra, monto y número de cuotas.");return}S.vc.push({id:id(),n:val("vn"),m:m,c:c,pg:0,f:val("vf")||today()});save();clr(["vn","vm","vq"]);draw();msg("Visacuota agregada")}
function vcPay(i){var x=by(S.vc,i);if(x&&x.pg<x.c){x.pg++;save();draw()}}
/* deudas */
function deu(){
  var rest=R(S.deudas.reduce(function(t,d){return t+d.m-sum(S.pagos.filter(function(p){return p.d===d.id}))},0)),h='<div class="card"><h2>Nueva deuda</h2><div class="grid"><input id="dn" placeholder="Nombre"><input id="dm" type="number" inputmode="decimal" step="0.01" placeholder="Monto total"></div><div class="grid"><select id="du">'+op(S.cfg.ubic,"","Ubicación…")+'</select><input id="df" type="date" value="'+today()+'"></div><input id="dt" placeholder="Notas (opcional)" style="margin-bottom:8px"><button style="width:100%" onclick="addD()">Agregar deuda</button></div><div class="card">'+hd("dl","Mis deudas",S.deudas.length+" · restan "+f(rest));
  if(isO("dl")){if(!S.deudas.length)h+='<div class="empty">Sin deudas registradas.</div>';
    S.deudas.forEach(function(d){
      var ps=S.pagos.filter(function(p){return p.d===d.id}),pg=sum(ps),re=R(d.m-pg),k="d"+d.id;
      h+='<div class="sub">'+hd(k,esc(d.n)+(re<=0?" ✓":""),(re<=0?'<span class="ok">Pagada</span>':'Restan <b class="or">'+f(re)+'</b>')+' de '+f(d.m),true);
      if(V.o[k]){h+='<div class="bar"><i style="width:'+(d.m?Math.min(100,pg/d.m*100):0)+'%"></i></div><div class="tag" style="margin:6px 0">Pagado '+f(pg)+' · '+nmx(S.cfg.ubic,d.u)+(d.f?' · '+fd(d.f):'')+(d.nota?' · '+esc(d.nota):'')+'</div>'
        +'<h2 style="margin-top:10px">Pagos registrados</h2>'+(ps.length?ps.slice().reverse().map(function(p){return '<div class="item"><div class="row" onclick="ted(\'pg:'+p.id+'\')" style="cursor:pointer"><span>'+fd(p.f)+(p.nt?' · '+esc(p.nt):'')+'</span><b class="amt">'+f(p.m)+'</b></div>'+(V.ed==="pg:"+p.id?form("pagos",p,[["m","Monto","n"],["f","Fecha","d"],["nt","Notas","t"]]):'')+'</div>'}).join(""):'<div class="tag">Aún no hay pagos.</div>')
        +'<div class="grid" style="margin-top:10px"><input id="pm'+d.id+'" type="number" inputmode="decimal" step="0.01" placeholder="Monto del pago"><input id="pf'+d.id+'" type="date" value="'+today()+'"></div><input id="pn'+d.id+'" placeholder="Notas (opcional)" style="margin-bottom:8px"><button style="width:100%" onclick="addPago(\''+d.id+'\')">Registrar pago</button>'
        +'<button class="ghost" style="width:100%;margin-top:6px" onclick="ted(\'de:'+d.id+'\')">Editar o eliminar deuda</button>'+(V.ed==="de:"+d.id?form("deudas",d,[["n","Nombre","t"],["m","Monto total","n"],["u","Ubicación","s",S.cfg.ubic],["f","Fecha","d"],["nota","Notas","t"]]):'')}
      h+='</div>'})}
  return h+'</div>'}
function addD(){var m=parseFloat(val("dm"));if(!val("dn")||!(m>0)){msg("Escribe nombre y un monto mayor que 0.");return}S.deudas.push({id:id(),n:val("dn"),m:m,u:val("du"),f:val("df"),nota:val("dt")});V.o.dl=true;save();clr(["dn","dm","du","dt"]);draw();msg("Deuda agregada")}
function addPago(d){var m=parseFloat(val("pm"+d));if(!(m>0)){msg("Escribe un monto mayor que 0.");return}S.pagos.push({id:id(),d:d,m:m,f:val("pf"+d)||today(),nt:val("pn"+d)});save();clr(["pm"+d,"pn"+d]);draw();msg("Pago registrado")}
/* fijos */
function grp(tp,t){
  var L=S.pl.filter(function(x){return x.tp===tp}),tot=sum(L),sa=S.ps[tp],h='<div class="card">'+hd("g"+tp,t,"Total "+f(tot)+" · saldo "+f(R(sa-tot)));
  if(isO("g"+tp)){h+='<div class="kv"><span>Salario</span><input class="num" type="number" inputmode="decimal" step="0.01" value="'+sa+'" onchange="S.ps[\''+tp+'\']=+this.value||0;save();draw()"></div>'
    +(L.length?L.map(function(x){var g=by(S.cfg.gastos,x.g);return '<div class="item"><div class="row" onclick="ted(\'pl:'+x.id+'\')" style="cursor:pointer"><b>'+(g?esc(g.n):"(eliminado)")+'</b><span class="amt">'+f(x.m)+'</span></div><div class="tag">'+nmx(S.cfg.cuentas,x.p)+'</div>'+(V.ed==="pl:"+x.id?form("pl",x,[["g","Gasto","s",S.cfg.gastos],["m","Monto","n"],["p","Cuenta","s",S.cfg.cuentas]]):'')+'</div>'}).join(""):'<div class="empty">Sin gastos en esta lista.</div>')
    +(S.cfg.gastos.length&&S.cfg.cuentas.length?'<div class="grid" style="margin-top:10px"><select id="x'+tp+'g">'+op(S.cfg.gastos,"","Gasto…")+'</select><input id="x'+tp+'m" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><select id="x'+tp+'p" style="margin-bottom:8px">'+op(S.cfg.cuentas,"","Cuenta…")+'</select><button style="width:100%" onclick="addPl(\''+tp+'\')">Agregar</button>':'')
    +(L.length?'<button class="ghost" style="width:100%;margin-top:8px;border:1px solid var(--line)" onclick="loadPl(\''+tp+'\')">Cargar a la quincena actual</button>':'')}
  return h+'</div>'}
function addPl(tp){var g=val("x"+tp+"g"),p=val("x"+tp+"p"),m=parseFloat(val("x"+tp+"m"));if(!g||!p||!(m>0)){msg("Elige gasto y cuenta, y escribe un monto.");return}S.pl.push({id:id(),tp:tp,g:g,m:m,p:p});save();clr(["x"+tp+"g","x"+tp+"m","x"+tp+"p"]);draw()}
function loadPl(tp){var l=S.pl.filter(function(x){return x.tp===tp});l.forEach(function(x){S.plan.push({id:id(),g:x.g,m:x.m,p:x.p,f:today(),nt:"",k:key()})});save();draw();msg("Cargados "+l.length+" gastos a "+nom(key()))}
function fij(){return grp("F","Gastos fijos")+grp("V","Gastos variables")}
/* ajustes */
function cl(k,t){
  var L=S.cfg[k],h='<div class="card">'+hd("cf"+k,t,L.length+" elementos");
  if(!isO("cf"+k))return h+'</div>';
  if(k==="gastos"){L.forEach(function(x){h+='<div class="item"><div class="row" onclick="ted(\'cg:'+x.id+'\')" style="cursor:pointer"><b>'+esc(x.n)+'</b><span class="tag">'+nmx(S.cfg.cats,x.c)+' · '+nmx(S.cfg.tipos,x.t)+'</span></div>'+(V.ed==="cg:"+x.id?form("cfg.gastos",x,[["n","Nombre","t"],["c","Categoría","s",S.cfg.cats],["t","Tipo","s",S.cfg.tipos]]):'')+'</div>'});
    h+='<input id="cak'+k+'" placeholder="Nuevo gasto" style="margin:8px 0"><div class="grid"><select id="cgc">'+op(S.cfg.cats,"","Categoría…")+'</select><select id="cgt">'+op(S.cfg.tipos,"","Tipo…")+'</select></div>'}
  else{L.forEach(function(x){h+='<div class="row" style="margin-bottom:6px"><input value="'+esc(x.n)+'"'+ch("cfg."+k,x.id,"n")+'><button class="ghost" onclick="rm(\'cfg.'+k+'\',\''+x.id+'\')">Eliminar</button></div>'});
    h+='<input id="cak'+k+'" placeholder="Nuevo elemento" style="margin:4px 0 8px">'}
  return h+'<button style="width:100%" onclick="ad(\''+k+'\')">Agregar</button></div>'}
function ad(k){var n=val("cak"+k);if(!n){msg("Escribe un nombre.");return}var x={id:id(),n:n};if(k==="gastos"){x.c=val("cgc");x.t=val("cgt")}S.cfg[k].push(x);save();clr(["cak"+k,"cgc","cgt"]);draw();msg("Agregado")}
function copyText(t,ok){
  function fb(){var e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();try{document.execCommand("copy");msg(ok)}catch(x){msg("No se pudo copiar.")}document.body.removeChild(e)}
  try{navigator.clipboard.writeText(t).then(function(){msg(ok)},fb)}catch(e){fb()}}
function copyTsv(){
  var rows=[["Quincena","Fecha","Gasto","Categoría","Tipo","Monto","Cuenta","Notas"]].concat(S.plan.map(function(x){var g=by(S.cfg.gastos,x.g)||{};return [x.k,fd(x.f),g.n||"",(by(S.cfg.cats,g.c)||{}).n||"",(by(S.cfg.tipos,g.t)||{}).n||"",String(x.m).replace(".",","),(by(S.cfg.cuentas,x.p)||{}).n||"",x.nt||""]}));
  copyText(rows.map(function(r){return r.join("\t")}).join("\n"),"Gastos copiados. Pégalos en Excel")}
function restaurar(){var t=val("rs");if(!t){msg("Pega primero el respaldo.");return}
  try{var o=JSON.parse(t);if(!o.cfg||!o.plan||!o.sal)throw 0;S=o;mig();save();clr(["rs"]);draw();msg("Respaldo restaurado")}catch(e){msg("Ese texto no es un respaldo válido.")}}
function aju(){
  return '<div class="tag" style="margin-bottom:10px">Lo que agregues, cambies o elimines aquí aparece solo en todas las pantallas.</div>'
   +cl("cats","Categorías")+cl("tipos","Tipos de gasto")+cl("cuentas","Cuentas, métodos de pago y entidades")+ret()+gr()+cl("gastos","Gastos (nombre, categoría y tipo)")+cl("ubic","Ubicaciones de deudas")+icCard()
   +'<div class="card"><h2>Respaldo y exportar</h2><div class="tag" style="margin-bottom:8px">Copia tus datos para guardarlos en Notas. Para Excel, pega los gastos en una hoja.</div><button style="width:100%;margin-bottom:8px" onclick="copyText(JSON.stringify(S),\'Respaldo copiado\')">Copiar respaldo completo</button><button style="width:100%;margin-bottom:12px" onclick="copyTsv()">Copiar gastos para Excel</button><textarea id="rs" placeholder="Pega aquí un respaldo para restaurarlo"></textarea><button class="ghost" style="width:100%;border:1px solid var(--line)" onclick="restaurar()">Restaurar respaldo (reemplaza todo)</button></div><div class="tag" style="text-align:center;margin-top:6px">Versión 5</div>'}
function draw(){
  var T={ini:ini,res:res,pre:pre,sal:sal,cue:cue,deu:deu,fij:fij,aju:aju},m={},ap=document.getElementById("app"),sh=document.getElementById("sheet"),tp=document.getElementById("top"),isF=/^(INPUT|SELECT|TEXTAREA)$/;
  if(document.querySelectorAll)document.querySelectorAll("#app [id],#sheet [id]").forEach(function(e){if(isF.test(e.tagName))m[e.id]=e.value});
  ap.innerHTML=T[V.tab]();
  sh.innerHTML=sheet();sh.className=V.sheet?"on":"";
  for(var i in m){var e=document.getElementById(i);if(e&&e.tagName&&isF.test(e.tagName))e.value=m[i]}
  if(document.getElementById("si"))sinfo();
  if(document.getElementById("sbi"))sbinfo();
  tp.className="st-"+S.ui.st;
  tp.innerHTML=IC.map(function(t){return '<button class="'+(V.tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span class="ic" style="'+cv(ucol(t[0]))+'">'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
draw();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
